<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポモドーロタイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #fb923c;
    --accent-glow: rgba(251, 146, 60, 0.45);
    --bg-a: #1e1b4b;
    --bg-b: #312e81;
    --text-main: #f5f5f7;
    --text-sub: rgba(245, 245, 247, 0.55);
  }

  body.break-mode {
    --accent: #34d399;
    --accent-glow: rgba(52, 211, 153, 0.45);
    --bg-a: #022c22;
    --bg-b: #064e3b;
  }

  body.stopwatch-mode {
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.45);
    --bg-a: #0c1a2e;
    --bg-b: #1e3a5f;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    color: var(--text-main);
    background: linear-gradient(160deg, var(--bg-a), var(--bg-b));
    background-size: 200% 200%;
    animation: bg-shift 18s ease-in-out infinite alternate;
    transition: background 1.2s ease;
    position: relative;
    overflow: hidden;
  }

  @keyframes bg-shift {
    0%   { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.45;
    pointer-events: none;
    transition: background 1.2s ease;
  }

  .orb-1 {
    width: 380px;
    height: 380px;
    background: var(--accent);
    top: -120px;
    left: -100px;
    animation: float1 22s ease-in-out infinite alternate;
  }

  .orb-2 {
    width: 320px;
    height: 320px;
    background: var(--bg-b);
    bottom: -100px;
    right: -80px;
    animation: float2 26s ease-in-out infinite alternate;
  }

  @keyframes float1 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(60px, 40px) scale(1.15); }
  }

  @keyframes float2 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-50px, -30px) scale(1.1); }
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 32px;
    padding: 48px 56px;
    text-align: center;
    backdrop-filter: blur(24px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
  }

  .mode-badge {
    display: inline-block;
    padding: 6px 20px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    margin-bottom: 20px;
    transition: color 1s ease, border-color 1s ease;
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
    padding: 4px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px;
  }

  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
  }

  .tab-btn:hover {
    color: var(--text-main);
  }

  .tab-btn.active {
    background: var(--accent);
    color: #1a1a2e;
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .view {
    animation: view-fade 0.35s ease;
  }

  @keyframes view-fade {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .settings {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 28px;
  }

  .setting {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--text-sub);
  }

  .setting input {
    width: 60px;
    padding: 6px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    text-align: center;
    transition: border-color 0.3s ease, opacity 0.3s ease;
  }

  .setting input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .setting input:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .ring-wrap {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto 32px;
  }

  .ring {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: rgba(255, 255, 255, 0.08);
    stroke-width: 10;
  }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 1s ease;
    filter: drop-shadow(0 0 10px var(--accent-glow));
  }

  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 10px var(--accent-glow)); }
    50%      { filter: drop-shadow(0 0 22px var(--accent-glow)); }
  }

  .ring-wrap.is-running .ring-progress {
    animation: pulse-glow 2.6s ease-in-out infinite;
  }

  .time-display {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.6rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }

  .time-display--compact {
    font-size: 3rem;
    letter-spacing: 0.02em;
  }

  .laps {
    max-height: 132px;
    overflow-y: auto;
    margin-bottom: 28px;
    border-radius: 14px;
  }

  .laps:empty {
    display: none;
  }

  .lap-item {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 16px;
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
    color: var(--text-sub);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .lap-item:first-child {
    color: var(--text-main);
  }

  .lap-item:last-child {
    border-bottom: none;
  }

  .lap-item .lap-number {
    font-weight: 600;
    color: var(--accent);
  }

  .session-dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 36px;
  }

  .session-dots .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }

  .session-dots .dot.filled {
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .btn {
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.3s ease, box-shadow 0.3s ease, color 1s ease;
  }

  .btn:active {
    transform: scale(0.92);
  }

  .btn-primary {
    width: 88px;
    height: 88px;
    background: var(--accent);
    color: #1a1a2e;
    box-shadow: 0 8px 24px var(--accent-glow);
  }

  .btn-primary:hover {
    transform: scale(1.05);
  }

  .btn-primary svg {
    width: 34px;
    height: 34px;
  }

  .btn-primary svg.icon-hidden {
    display: none;
  }

  .btn-ghost {
    width: 56px;
    height: 56px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text-main);
  }

  .btn-ghost:hover {
    background: rgba(255, 255, 255, 0.12);
  }

  .btn-ghost:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .btn-ghost:disabled:hover {
    background: rgba(255, 255, 255, 0.06);
  }

  .btn-ghost svg {
    width: 22px;
    height: 22px;
  }

  @media (max-width: 480px) {
    .card {
      padding: 36px 28px;
    }
    .ring-wrap {
      width: 220px;
      height: 220px;
    }
    .time-display {
      font-size: 2.8rem;
    }
    .time-display--compact {
      font-size: 2.4rem;
    }
    .tab-btn {
      font-size: 0.72rem;
      padding: 10px 12px;
    }
  }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <main class="card">
    <div class="tabs" role="tablist">
      <button class="tab-btn active" id="tabPomodoroBtn" data-view="pomodoro" role="tab" aria-selected="true">ポモドーロ</button>
      <button class="tab-btn" id="tabStopwatchBtn" data-view="stopwatch" role="tab" aria-selected="false">ストップウォッチ</button>
    </div>

    <section class="view" id="pomodoroView">
      <p class="mode-badge" id="modeLabel">Focus Time</p>

      <div class="settings">
        <label class="setting">
          作業
          <input type="number" id="focusInput" min="1" max="180" step="1" value="25" inputmode="numeric">
          分
        </label>
        <label class="setting">
          休憩
          <input type="number" id="breakInput" min="1" max="60" step="1" value="5" inputmode="numeric">
          分
        </label>
      </div>

      <div class="ring-wrap" id="ringWrap">
        <svg class="ring" viewBox="0 0 300 300">
          <circle class="ring-track" cx="150" cy="150" r="140"></circle>
          <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="140"></circle>
        </svg>
        <div class="time-display" id="timeDisplay">25:00</div>
      </div>

      <div class="session-dots" id="sessionDots"></div>

      <div class="controls">
        <button class="btn btn-ghost" id="resetBtn" aria-label="リセット" title="リセット">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/>
          </svg>
        </button>

        <button class="btn btn-primary" id="toggleBtn" aria-label="開始" title="開始">
          <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" class="icon-hidden">
            <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="view" id="stopwatchView" hidden>
      <p class="mode-badge">Stopwatch</p>

      <div class="ring-wrap" id="swRingWrap">
        <svg class="ring" viewBox="0 0 300 300">
          <circle class="ring-track" cx="150" cy="150" r="140"></circle>
          <circle class="ring-progress" id="swRingProgress" cx="150" cy="150" r="140"></circle>
        </svg>
        <div class="time-display time-display--compact" id="swTimeDisplay">00:00.00</div>
      </div>

      <div class="laps" id="swLaps"></div>

      <div class="controls">
        <button class="btn btn-ghost" id="swResetBtn" aria-label="リセット" title="リセット">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/>
          </svg>
        </button>

        <button class="btn btn-primary" id="swToggleBtn" aria-label="開始" title="開始">
          <svg id="swIconPlay" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="swIconPause" viewBox="0 0 24 24" fill="currentColor" class="icon-hidden">
            <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
          </svg>
        </button>

        <button class="btn btn-ghost" id="swLapBtn" aria-label="ラップ" title="ラップ" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M14 6l-1-2H5v17h2v-7h5l1 2h7V6z"/>
          </svg>
        </button>
      </div>
    </section>
  </main>

<script>
  let FOCUS_DURATION = 25 * 60;
  let BREAK_DURATION = 5 * 60;
  const MAX_SESSIONS = 4;
  const RADIUS = 140;
  const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

  let totalDuration = FOCUS_DURATION;
  let remainingSeconds = FOCUS_DURATION;
  let isBreak = false;
  let isRunning = false;
  let timerId = null;
  let completedSessions = 0;

  const timeDisplay = document.getElementById('timeDisplay');
  const modeLabel = document.getElementById('modeLabel');
  const ringWrap = document.getElementById('ringWrap');
  const ringProgress = document.getElementById('ringProgress');
  const sessionDots = document.getElementById('sessionDots');
  const toggleBtn = document.getElementById('toggleBtn');
  const resetBtn = document.getElementById('resetBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const focusInput = document.getElementById('focusInput');
  const breakInput = document.getElementById('breakInput');

  let activeView = 'pomodoro';
  const tabBtns = document.querySelectorAll('.tab-btn');
  const pomodoroView = document.getElementById('pomodoroView');
  const stopwatchView = document.getElementById('stopwatchView');

  ringProgress.style.strokeDasharray = `${CIRCUMFERENCE}`;

  function formatTime(totalSeconds) {
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  }

  function renderSessionDots() {
    sessionDots.innerHTML = '';
    const filled = completedSessions % MAX_SESSIONS;
    for (let i = 0; i < MAX_SESSIONS; i++) {
      const dot = document.createElement('span');
      dot.className = 'dot' + (i < filled ? ' filled' : '');
      sessionDots.appendChild(dot);
    }
  }

  function updateRing() {
    const fraction = remainingSeconds / totalDuration;
    ringProgress.style.strokeDashoffset = `${CIRCUMFERENCE * (1 - fraction)}`;
  }

  function applyTheme() {
    document.body.classList.remove('break-mode', 'stopwatch-mode');
    if (activeView === 'stopwatch') {
      document.body.classList.add('stopwatch-mode');
    } else if (isBreak) {
      document.body.classList.add('break-mode');
    }
  }

  function switchView(view) {
    activeView = view;
    pomodoroView.hidden = view !== 'pomodoro';
    stopwatchView.hidden = view !== 'stopwatch';
    tabBtns.forEach((btn) => {
      const isActive = btn.dataset.view === view;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-selected', String(isActive));
    });
    applyTheme();
  }

  function updateDisplay() {
    timeDisplay.textContent = formatTime(remainingSeconds);
    modeLabel.textContent = isBreak ? 'Break Time' : 'Focus Time';
    applyTheme();
    updateRing();
  }

  function playChime() {
    // 終了時に「ピンポーン」のような落ち着いた二音チャイムを鳴らす
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 660].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.3;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.2);
      osc.start(start);
      osc.stop(start + 1.2);
    });
  }

  function tick() {
    if (remainingSeconds > 0) {
      remainingSeconds--;
    }

    if (remainingSeconds === 0) {
      if (!isBreak) {
        completedSessions++;
        renderSessionDots();
        playChime();
      }
      isBreak = !isBreak;
      totalDuration = isBreak ? BREAK_DURATION : FOCUS_DURATION;
      remainingSeconds = totalDuration;
    }

    updateDisplay();
  }

  function setRunning(running) {
    isRunning = running;
    ringWrap.classList.toggle('is-running', running);
    iconPlay.classList.toggle('icon-hidden', running);
    iconPause.classList.toggle('icon-hidden', !running);
    toggleBtn.setAttribute('aria-label', running ? '一時停止' : '開始');
    toggleBtn.setAttribute('title', running ? '一時停止' : '開始');
    focusInput.disabled = running;
    breakInput.disabled = running;
  }

  function clampMinutes(value, min, max) {
    let minutes = parseInt(value, 10);
    if (Number.isNaN(minutes)) minutes = min;
    return Math.min(Math.max(minutes, min), max);
  }

  function applyFocusDuration() {
    const minutes = clampMinutes(focusInput.value, 1, 180);
    focusInput.value = minutes;
    FOCUS_DURATION = minutes * 60;
    if (!isBreak) {
      totalDuration = FOCUS_DURATION;
      remainingSeconds = FOCUS_DURATION;
      updateDisplay();
    }
  }

  function applyBreakDuration() {
    const minutes = clampMinutes(breakInput.value, 1, 60);
    breakInput.value = minutes;
    BREAK_DURATION = minutes * 60;
    if (isBreak) {
      totalDuration = BREAK_DURATION;
      remainingSeconds = BREAK_DURATION;
      updateDisplay();
    }
  }

  function startTimer() {
    if (timerId !== null) return;
    timerId = setInterval(tick, 1000);
    setRunning(true);
  }

  function stopTimer() {
    clearInterval(timerId);
    timerId = null;
    setRunning(false);
  }

  function toggleTimer() {
    if (isRunning) {
      stopTimer();
    } else {
      startTimer();
    }
  }

  function resetTimer() {
    stopTimer();
    isBreak = false;
    totalDuration = FOCUS_DURATION;
    remainingSeconds = FOCUS_DURATION;
    completedSessions = 0;
    renderSessionDots();
    updateDisplay();
  }

  toggleBtn.addEventListener('click', toggleTimer);
  resetBtn.addEventListener('click', resetTimer);
  focusInput.addEventListener('change', applyFocusDuration);
  breakInput.addEventListener('change', applyBreakDuration);
  tabBtns.forEach((btn) => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });

  renderSessionDots();
  updateDisplay();

  // --- ストップウォッチ ---
  const swRingWrap = document.getElementById('swRingWrap');
  const swRingProgress = document.getElementById('swRingProgress');
  const swTimeDisplay = document.getElementById('swTimeDisplay');
  const swLaps = document.getElementById('swLaps');
  const swToggleBtn = document.getElementById('swToggleBtn');
  const swResetBtn = document.getElementById('swResetBtn');
  const swLapBtn = document.getElementById('swLapBtn');
  const swIconPlay = document.getElementById('swIconPlay');
  const swIconPause = document.getElementById('swIconPause');

  let swElapsedMs = 0;
  let swRunning = false;
  let swIntervalId = null;
  let swStartTimestamp = 0;
  let swLapCount = 0;
  let swLastLapMs = 0;

  swRingProgress.style.strokeDasharray = `${CIRCUMFERENCE}`;

  function formatStopwatchTime(ms) {
    const centiseconds = Math.floor((ms % 1000) / 10);
    const totalSeconds = Math.floor(ms / 1000);
    const seconds = totalSeconds % 60;
    const minutes = Math.floor(totalSeconds / 60);
    return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(centiseconds).padStart(2, '0')}`;
  }

  function updateSwRing() {
    const fraction = (swElapsedMs % 60000) / 60000;
    swRingProgress.style.strokeDashoffset = `${CIRCUMFERENCE * (1 - fraction)}`;
  }

  function updateSwDisplay() {
    swTimeDisplay.textContent = formatStopwatchTime(swElapsedMs);
    updateSwRing();
  }

  function setSwRunning(running) {
    swRunning = running;
    swRingWrap.classList.toggle('is-running', running);
    swIconPlay.classList.toggle('icon-hidden', running);
    swIconPause.classList.toggle('icon-hidden', !running);
    swToggleBtn.setAttribute('aria-label', running ? '一時停止' : '開始');
    swToggleBtn.setAttribute('title', running ? '一時停止' : '開始');
    swLapBtn.disabled = !running;
    swResetBtn.disabled = running;
  }

  function swTick() {
    swElapsedMs = Date.now() - swStartTimestamp;
    updateSwDisplay();
  }

  function startStopwatch() {
    if (swIntervalId !== null) return;
    swStartTimestamp = Date.now() - swElapsedMs;
    swIntervalId = setInterval(swTick, 10);
    setSwRunning(true);
  }

  function stopStopwatch() {
    clearInterval(swIntervalId);
    swIntervalId = null;
    setSwRunning(false);
  }

  function toggleStopwatch() {
    if (swRunning) {
      stopStopwatch();
    } else {
      startStopwatch();
    }
  }

  function resetStopwatch() {
    if (swRunning) return;
    swElapsedMs = 0;
    swLapCount = 0;
    swLastLapMs = 0;
    swLaps.innerHTML = '';
    updateSwDisplay();
  }

  function recordLap() {
    if (!swRunning) return;
    swLapCount++;
    const lapMs = swElapsedMs - swLastLapMs;
    swLastLapMs = swElapsedMs;
    const item = document.createElement('div');
    item.className = 'lap-item';
    item.innerHTML = `<span class="lap-number">Lap ${swLapCount}</span><span>${formatStopwatchTime(lapMs)}</span><span>${formatStopwatchTime(swElapsedMs)}</span>`;
    swLaps.insertBefore(item, swLaps.firstChild);
  }

  swToggleBtn.addEventListener('click', toggleStopwatch);
  swResetBtn.addEventListener('click', resetStopwatch);
  swLapBtn.addEventListener('click', recordLap);

  updateSwDisplay();
</script>
</body>
</html>
